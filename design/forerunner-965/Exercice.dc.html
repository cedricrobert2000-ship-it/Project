<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Exercice en cours</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#000}</style>
</helmet>
<div style="width: 454px; height: 454px; border-radius: 50%; background: #000000; overflow: hidden; position: relative; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Lexend', system-ui, sans-serif; color: #F4F4F2">
  <div style="font-size: 16px; color: #55554F">Exercice 1 sur 4</div>
  <div style="font-size: 26px; font-weight: 500; margin-top: 4px">Développé couché</div>
  <div style="display: flex; align-items: baseline; gap: 8px; margin-top: 6px">
    <span style="font-size: 124px; font-weight: 600; letter-spacing: -0.04em; line-height: 1; color: {{accent}}; font-variant-numeric: tabular-nums">80</span>
    <span style="font-size: 28px; color: #8D8D88">kg</span>
  </div>
  <div style="font-size: 26px; font-weight: 500; margin-top: 8px">5 × 5</div>
  <div style="display: flex; gap: 12px; margin-top: 18px; align-items: center">
    <div style="width: 20px; height: 20px; border-radius: 50%; background: {{accent}}"></div>
    <div style="width: 20px; height: 20px; border-radius: 50%; background: {{accent}}"></div>
    <div style="width: 20px; height: 20px; border-radius: 50%; box-sizing: border-box; border: 2.5px solid #F4F4F2"></div>
    <div style="width: 20px; height: 20px; border-radius: 50%; background: #262626"></div>
    <div style="width: 20px; height: 20px; border-radius: 50%; background: #262626"></div>
  </div>
  <div style="font-size: 15px; color: #8D8D88; margin-top: 12px">Série 3, dernière au max</div>
  <div style="font-size: 14px; color: #55554F; margin-top: 14px">Lap pour valider</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D4F24A","options":["#D4F24A","#FFFFFF","#7FD1FF"]},"$preview":{"width":454,"height":454}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#D4F24A' };
  }
}
</script>
</body>
</html>
